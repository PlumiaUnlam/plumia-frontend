<style>
  .reveal { fill:none; stroke:#fff; stroke-width:29; stroke-linecap:round; stroke-linejoin:round;
            stroke-dasharray:1 1.2; stroke-dashoffset:1.05; animation: write 2.6s cubic-bezier(.45,.05,.35,1) infinite; }
  .ink { animation: fade 2.6s linear infinite; }
  .pen { transform-box: view-box; transform-origin: 150px 1222px; animation: nudge 2.6s ease-in-out infinite; }
  @keyframes write { 0% { stroke-dashoffset:1.05; } 55%,100% { stroke-dashoffset:0; } }
  @keyframes fade { 0%,78% { opacity:1; } 94%,100% { opacity:0; } }
  @keyframes nudge {
    0%,100% { transform: rotate(0deg); }
    15% { transform: rotate(-1.2deg); }
    30% { transform: rotate(.8deg); }
    45% { transform: rotate(-.6deg); }
    60% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .reveal, .ink, .pen { animation:none; stroke-dashoffset:0; } }
</style>
